<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="900" height="420" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Trainer Central Automation: Architecture</text>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
<g font-size="13" fill="#111">
<rect x="30" y="60" width="170" height="60" rx="8" fill="#f1f1f1" stroke="#999"/><text x="115" y="86" text-anchor="middle" font-weight="bold">Trainer Central</text><text x="115" y="104" text-anchor="middle" font-size="11">emails trainer on submit</text>
<rect x="250" y="60" width="190" height="60" rx="8" fill="#f1f1f1" stroke="#999"/><text x="345" y="86" text-anchor="middle" font-weight="bold">Trainer's Drive folder</text><text x="345" y="104" text-anchor="middle" font-size="11">one .txt file per email</text>
<rect x="650" y="60" width="220" height="60" rx="8" fill="#f1f1f1" stroke="#999"/><text x="760" y="86" text-anchor="middle" font-weight="bold">Dashboard API (Render)</text><text x="760" y="104" text-anchor="middle" font-size="11">GET /health, POST /api/entries</text>
<rect x="30" y="160" width="840" height="230" rx="12" fill="#e3edfb" stroke="#2f6fd0" stroke-width="2"/>
<text x="50" y="184" font-weight="bold" fill="#2f6fd0">My laptop (Windows): app.py</text>
<rect x="50" y="205" width="150" height="70" rx="8" fill="#fff" stroke="#999"/><text x="125" y="232" text-anchor="middle" font-weight="bold">Task Scheduler</text><text x="125" y="250" text-anchor="middle" font-size="11">every 30 min</text>
<rect x="240" y="205" width="150" height="70" rx="8" fill="#fff" stroke="#999"/><text x="315" y="232" text-anchor="middle" font-weight="bold">Fetch from Drive</text><text x="315" y="250" text-anchor="middle" font-size="11">new files only</text>
<rect x="430" y="205" width="170" height="70" rx="8" fill="#fff" stroke="#999"/><text x="515" y="232" text-anchor="middle" font-weight="bold">Claude analysis</text><text x="515" y="250" text-anchor="middle" font-size="11">is it mine? extract JSON</text>
<rect x="640" y="205" width="210" height="70" rx="8" fill="#fff" stroke="#999"/><text x="745" y="232" text-anchor="middle" font-weight="bold">Push to API</text><text x="745" y="250" text-anchor="middle" font-size="11">retries, sender = my name</text>
<rect x="240" y="310" width="190" height="55" rx="8" fill="#fff" stroke="#999"/><text x="335" y="334" text-anchor="middle" font-weight="bold">state.db (SQLite)</text><text x="335" y="351" text-anchor="middle" font-size="11">processed files, no duplicates</text>
<rect x="470" y="310" width="190" height="55" rx="8" fill="#fff" stroke="#999"/><text x="565" y="334" text-anchor="middle" font-weight="bold">logs/run.log</text><text x="565" y="351" text-anchor="middle" font-size="11">files seen, matched, API status</text>
</g>
<g stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)">
<line x1="200" y1="90" x2="248" y2="90"/>
<line x1="345" y1="120" x2="315" y2="203"/>
<line x1="200" y1="240" x2="238" y2="240"/>
<line x1="390" y1="240" x2="428" y2="240"/>
<line x1="600" y1="240" x2="638" y2="240"/>
<line x1="760" y1="203" x2="760" y2="122"/>
<line x1="315" y1="277" x2="315" y2="308"/>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
